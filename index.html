<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>집중력 두더지</title>
<link rel="stylesheet" href="style.css" />
<!-- Firebase SDK (compat 버전: import/export 문법 없이 바로 사용 가능) -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
</head>
<body>

<!-- ================= 1. 메인 화면 ================= -->
<section id="screen-main" class="screen active">
  <div class="panel">
    <h1 id="logo" class="logo">집중력 두더지</h1>
    <input id="nickname-input" type="text" placeholder="닉네임을 입력하세요" maxlength="12" />
    <button id="btn-start" class="btn btn-primary">게임 시작</button>
    <div class="btn-row">
      <button id="btn-howto" class="btn">게임 설명</button>
      <button id="btn-ranking" class="btn">랭킹</button>
    </div>
  </div>
</section>

<!-- ================= 2. 난이도 선택 화면 ================= -->
<section id="screen-difficulty" class="screen">
  <div class="panel">
    <h2>난이도 선택</h2>
    <div class="diff-list">
      <button class="btn diff-btn" data-diff="easy">EASY <span>여유롭게</span></button>
      <button class="btn diff-btn" data-diff="normal">NORMAL <span>기본</span></button>
      <button class="btn diff-btn" data-diff="hard">HARD <span>빡빡하게</span></button>
      <button id="btn-impossible" class="btn diff-btn hidden" data-diff="impossible">IMPOSSIBLE <span>???</span></button>
    </div>
    <button id="btn-impossible-info" class="btn btn-ghost hidden">IMPOSSIBLE 난이도 정보</button>
    <button id="btn-back-main" class="btn btn-ghost">뒤로</button>
  </div>
</section>

<!-- ================= 3. 수학 문제 화면 (1차/2차 공용) ================= -->
<section id="screen-math" class="screen">
  <div class="panel">
    <p id="math-label" class="label">문제를 풀어주세요</p>
    <p id="math-question" class="math-question">? + ?</p>
    <input id="math-answer" type="number" inputmode="numeric" placeholder="정답 입력" />
    <button id="btn-math-submit" class="btn btn-primary">제출</button>
    <p id="math-feedback" class="feedback"></p>
  </div>
</section>

<!-- ================= 4. 카운트다운 화면 ================= -->
<section id="screen-countdown" class="screen">
  <div class="countdown-wrap">
    <p id="countdown-text" class="countdown-text">3</p>
  </div>
</section>

<!-- ================= 5. 본게임 화면 ================= -->
<section id="screen-game" class="screen">
  <div class="hud">
    <span id="hud-time">0:60</span>
    <span id="hud-score">점수 0</span>
    <div class="hud-buttons">
    <button id="btn-mute" class="btn-icon" aria-label="음소거">🔊</button>
    <button id="btn-pause" class="btn-icon" aria-label="일시정지">‖</button>
  </div>
  </div>
  <div id="gold-indicator" class="gold-indicator hidden">다음 점수 2배!</div>
  <div id="game-field" class="game-field"></div>
</section>

<!-- 일시정지 오버레이 -->
<div id="pause-overlay" class="overlay hidden">
  <div class="panel">
    <h2>일시정지</h2>
    <button id="btn-resume" class="btn btn-primary">계속하기</button>
  </div>
</div>

<!-- ================= 6. 결과 화면 ================= -->
<section id="screen-result" class="screen">
  <div id="result-bg" class="result-bg">
    <div class="result-overlay">
      <p id="result-score" class="result-score">최종 점수 0</p>
      <p id="result-grade" class="result-grade">등급</p>
      <p id="result-mathdiff" class="result-mathdiff"></p>
      <div class="btn-row">
        <button id="btn-retry" class="btn">다시하기</button>
        <button id="btn-mainmenu" class="btn">메인 메뉴</button>
      </div>
    </div>
  </div>
</section>

<!-- IMPOSSIBLE 난이도 전용 정보 모달 (해금 후에만 버튼으로 접근 가능) -->
<div id="impossible-info-modal" class="overlay hidden">
  <div class="panel panel-scroll">
    <h2>IMPOSSIBLE 난이도 정보</h2>
    <div id="impossible-info-body" class="howto-body"></div>
    <button id="btn-impossible-info-close" class="btn btn-primary">닫기</button>
  </div>
</div>

<!-- 게임 설명 모달 -->
<div id="howto-modal" class="overlay hidden">
  <div class="panel panel-scroll">
    <h2>게임 설명</h2>
    <div id="howto-body" class="howto-body"></div>
    <button id="btn-howto-close" class="btn btn-primary">닫기</button>
  </div>
</div>

<!-- 랭킹 모달 -->
<div id="ranking-modal" class="overlay hidden">
  <div class="panel panel-scroll">
    <h2>랭킹</h2>
    <div class="diff-tabs" id="ranking-tabs">
      <button class="tab-btn active" data-diff="easy">EASY</button>
      <button class="tab-btn" data-diff="normal">NORMAL</button>
      <button class="tab-btn" data-diff="hard">HARD</button>
      <button id="ranking-tab-impossible" class="tab-btn hidden" data-diff="impossible">IMPOSSIBLE</button>
    </div>
    <div id="ranking-body" class="ranking-body">
      <p class="muted">아직 준비 중인 기능입니다.</p>
    </div>
    <div class="ranking-pager">
      <button id="btn-rank-prev" class="btn-icon" aria-label="이전 페이지">‹</button>
      <span id="ranking-page-label">1페이지</span>
      <button id="btn-rank-next" class="btn-icon" aria-label="다음 페이지">›</button>
    </div>
    <button id="btn-ranking-close" class="btn btn-primary">닫기</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
